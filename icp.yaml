# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.3.0/docs/schemas/icp-yaml-schema.json
# PIKO Monitor. Deployed onto the former PikoLock frontend canister (k6tpq),
# whose name is kept so the mainnet id mapping stays obvious.
canisters:
  - name: lock-frontend
    recipe:
      type: "@dfinity/static-site@v0.3.3"
      configuration:
        build:
          - npm install
          - npm run build
        dir: dist
